p2p_no_group_iface=1
driver_param=use_p2p_group_interface=1
wowlan_triggers=disconnect
p2p_disabled=1
bss_no_flush_when_down=1
# Apply the matched firmware PMF default on upgrades too. The base template is
# copied only when /data/vendor/wifi/wpa/wpa_supplicant.conf does not yet exist.
# Per-network required/disabled policy remains controlled by the framework.
pmf=1
